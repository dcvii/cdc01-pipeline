[project]
name = "telematics-generator"
version = "0.1.0"
description = "Synthetic telematics data generator for Temporal CDC demos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faker>=19,<25",
    "pendulum>=3,<4",
    "typer>=0.9,<0.13",
    "geohash2>=1.1,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=4,<5"
]

[project.scripts]
telematics-generator = "telematics_generator.cli:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
